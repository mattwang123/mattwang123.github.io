<style>
:root{--bg:#ffffff;--ink:#16181d;--ink-soft:#5b6472;--line:#e6e9ee;--accent:#0f62c4;

  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--ink:#e6edf3;--ink-soft:#9aa6b4;--line:#242c37;--accent:#7cb3e8}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.66;
  min-height:100vh;display:grid;place-items:center;padding:2rem;-webkit-font-smoothing:antialiased}

.code{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;color:var(--accent);margin-bottom:1rem}
h1{font-size:1.9rem;font-weight:600;letter-spacing:-.02em;margin-bottom:.8rem}
p{color:var(--ink-soft);margin-bottom:1.8rem}

  border:1px solid var(--line);border-radius:9px;padding:.6rem 1.1rem;text-decoration:none;
  transition:border-color .15s}
